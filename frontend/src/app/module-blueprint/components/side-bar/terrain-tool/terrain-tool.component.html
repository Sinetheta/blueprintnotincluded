<div class="box-card ui-widget terrain-card">
  <div class="box-card-title" i18n>Terrain Features</div>
  <p class="hint" i18n>
    Geysers and vents that are already on the map. They are annotations only —
    no materials, no build order.
  </p>

  <div class="section-label" i18n>Feature</div>
  <div class="feature-grid">
    <button
      *ngFor="let feature of features"
      type="button"
      class="feature-button"
      [class.selected]="tool.featureId === feature.id"
      (click)="tool.featureId = feature.id"
      [attr.aria-label]="feature.name"
      [pTooltip]="feature.name + ' (' + footprintLabel(feature) + ')'"
    >
      <img [src]="feature.iconUrl" [alt]="feature.name" />
    </button>
  </div>

  <label class="visibility-row">
    <input
      type="checkbox"
      [checked]="terrainService.visible"
      (change)="terrainService.toggleVisible()"
    />
    <span i18n>Show terrain features</span>
  </label>

  <p class="hint" i18n>
    Click the blueprint to place. Click an existing feature, from any tool, to
    select it and delete it. Right-click to return to Select.
  </p>
</div>
