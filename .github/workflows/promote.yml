# Promote staging's image to production, or roll production back.
#
# Staging deploys :latest on every push to master (publish.yml). Production
# runs the :prod tag, so pointing :prod at a manifest and re-running the
# production compose project IS the production deploy. Promotion is a
# server-side retag of the manifest :latest resolves to: nothing is rebuilt
# or re-uploaded, so production gets byte-for-byte what was tested on
# staging, in seconds.
#
# The old :prod moves to :prod-previous first, so "rollback" is the same
# button swapping the two. ghcr.io keeps every :sha-<short> tag as well, so
# an older build can always be put back by hand (deploy/README.md).
#
# Gated by the "production" GitHub Environment, which requires an approving
# reviewer before the job runs. The retag needs packages: write on
# GITHUB_TOKEN; the deploy needs the same SSH secrets as publish.yml.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "promote: make staging's current image (:latest) the production image. rollback: put the previous production image back."
        type: choice
        options:
          - promote
          - rollback
        default: promote

# One promotion at a time: two overlapping runs could cross their retags.
concurrency: promote-to-production

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blueprintnotincluded.org
    permissions:
      contents: read # checkout, for deploy/
      packages: write # the retag

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: ${{ inputs.action == 'rollback' && 'Roll production back' || 'Promote staging to production' }}
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          # Manifest digest a tag resolves to; empty when the tag does not
          # exist. Any other failure aborts, before a retag can run against a
          # wrong picture of the registry.
          digest() {
            local out
            if out=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}' 2>&1); then
              echo "$out"
            elif echo "$out" | grep -qiE 'not found|manifest unknown'; then
              echo ""
            else
              echo "::error::Could not inspect $IMAGE:$1: $out" >&2
              return 1
            fi
          }
          # Point tag $1 at the manifest of reference $2 (a tag or @digest),
          # server-side: no layers are pulled or pushed
          retag() {
            docker buildx imagetools create --tag "$IMAGE:$1" "$2"
          }

          latest=$(digest latest)
          prod=$(digest prod)
          previous=$(digest prod-previous)
          echo "latest        ${latest:-<none>}"
          echo "prod          ${prod:-<none>}"
          echo "prod-previous ${previous:-<none>}"

          if [ "$ACTION" = "promote" ]; then
            if [ -z "$latest" ]; then
              echo "::error::There is no :latest image to promote. Has a staging deploy run?"
              exit 1
            fi
            if [ "$latest" = "$prod" ]; then
              echo "Production already runs staging's image. Redeploying it anyway."
              echo "Production already runs staging's image ($latest); the tags did not change." >> "$GITHUB_STEP_SUMMARY"
            else
              if [ -n "$prod" ]; then
                retag prod-previous "$IMAGE@$prod"
              fi
              retag prod "$IMAGE@$latest"
              {
                echo "## Promoted to production"
                echo
                echo "| tag | before | after |"
                echo "|---|---|---|"
                echo "| prod | ${prod:-<none>} | $latest |"
                echo "| prod-previous | ${previous:-<none>} | ${prod:-<none>} |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if [ -z "$previous" ]; then
              echo "::error::There is no :prod-previous image to roll back to."
              exit 1
            fi
            if [ "$previous" = "$prod" ]; then
              echo "Production already runs the previous image. Redeploying it anyway."
            else
              # Swap, so that a second rollback goes forward again
              retag prod "$IMAGE@$previous"
              if [ -n "$prod" ]; then
                retag prod-previous "$IMAGE@$prod"
              fi
              {
                echo "## Rolled production back"
                echo
                echo "| tag | before | after |"
                echo "|---|---|---|"
                echo "| prod | ${prod:-<none>} | $previous |"
                echo "| prod-previous | $previous | ${prod:-<none>} |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # The retag alone changes nothing on the box: the production compose
      # project pulls :prod and restarts the app only when told to. Same
      # mechanism as the staging deploy in publish.yml, with the deploy/
      # directory from the commit being promoted — the workflow runs on the
      # ref it was dispatched from, normally master.
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync deploy/ to the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            deploy/ "deploy@$DEPLOY_HOST:/srv/bpni/deploy/"

      - name: Deploy production
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deploy@$DEPLOY_HOST" \
            /srv/bpni/deploy/bin/deploy.sh production
          echo "Production redeployed from \`$IMAGE:prod\`." >> "$GITHUB_STEP_SUMMARY"
