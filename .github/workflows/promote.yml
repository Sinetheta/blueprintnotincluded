# Promote staging's image to production, or roll production back.
#
# Staging deploys :latest on every push to master (publish.yml). Production
# runs the :prod tag with autodeploy on, so pointing :prod at a manifest IS
# the production deploy. Promotion is a server-side retag of the manifest
# :latest resolves to: nothing is rebuilt or re-uploaded, so production gets
# byte-for-byte what was tested on staging, in seconds.
#
# The old :prod moves to :prod-previous first, so "rollback" is the same
# button swapping the two. The registry therefore never holds more than
# three named manifests, and the daily registry-gc.yml removes the rest.
#
# Gated by the "production" GitHub Environment, which requires an approving
# reviewer before the job runs. It uses the same registry token as the
# staging deploy: minting the short-lived docker credential that the deploy
# already relies on needs registry write access, and a retag needs nothing
# more than that.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "promote: make staging's current image (:latest) the production image. rollback: put the previous production image back."
        type: choice
        options:
          - promote
          - rollback
        default: promote

# One promotion at a time: two overlapping runs could cross their retags.
concurrency: promote-to-production

# Nothing here talks to GitHub: the only credential this job needs is the
# registry token.
permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # The registry is read-only while a garbage collection runs (the daily
      # registry-gc.yml, at a quiet hour), and a collection first waits up to
      # 15 minutes for outstanding write credentials to expire before it does
      # its (quick) work. Wait rather than fail. This only needs the API
      # token, so it comes before the registry login: the docker credential
      # is minted right before the retag that uses it, because one minted
      # before a 15-minute wait is expired by the end of it (run
      # 38175116486), and is itself one more credential for the collection
      # to wait on.
      - name: Wait for any running garbage collection
        run: |
          # The API answers 404 when nothing is running, which doctl reports
          # as an error, so only that error means idle. Any other failure is
          # not an idle registry: keep polling, and give up only when the
          # window closes.
          for _ in $(seq 1 80); do
            if active=$(doctl registry garbage-collection get-active --format UUID --no-header 2>&1); then
              if [ -z "$active" ]; then
                exit 0
              fi
              echo "Garbage collection in progress, waiting..."
            elif echo "$active" | grep -qiE '404|not found'; then
              exit 0
            else
              echo "::warning::Could not query garbage collection: $active"
            fi
            sleep 15
          done
          echo "::error::Could not confirm the registry is writable after 20 minutes; try again later."
          exit 1

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 900

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: ${{ inputs.action == 'rollback' && 'Roll production back' || 'Promote staging to production' }}
        env:
          IMAGE: ${{ vars.DIGITALOCEAN_REGISTRY }}/${{ vars.IMAGE_NAME }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          # Manifest digest a tag resolves to; empty when the tag does not
          # exist. Any other failure aborts, before a retag can run against a
          # wrong picture of the registry.
          digest() {
            local out
            if out=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}' 2>&1); then
              echo "$out"
            elif echo "$out" | grep -qiE 'not found|manifest unknown'; then
              echo ""
            else
              echo "::error::Could not inspect $IMAGE:$1: $out" >&2
              return 1
            fi
          }
          # Point tag $1 at the manifest of reference $2 (a tag or @digest),
          # server-side: no layers are pulled or pushed
          retag() {
            docker buildx imagetools create --tag "$IMAGE:$1" "$2"
          }

          latest=$(digest latest)
          prod=$(digest prod)
          previous=$(digest prod-previous)
          echo "latest        ${latest:-<none>}"
          echo "prod          ${prod:-<none>}"
          echo "prod-previous ${previous:-<none>}"

          if [ "$ACTION" = "promote" ]; then
            if [ -z "$latest" ]; then
              echo "::error::There is no :latest image to promote. Has a staging deploy run?"
              exit 1
            fi
            if [ "$latest" = "$prod" ]; then
              echo "Production already runs staging's image. Nothing to do."
              echo "Production already runs staging's image ($latest). Nothing changed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ -n "$prod" ]; then
              retag prod-previous "$IMAGE@$prod"
            fi
            retag prod "$IMAGE@$latest"
            {
              echo "## Promoted to production"
              echo
              echo "| tag | before | after |"
              echo "|---|---|---|"
              echo "| prod | ${prod:-<none>} | $latest |"
              echo "| prod-previous | ${previous:-<none>} | ${prod:-<none>} |"
              echo
              echo "Production autodeploys from :prod; watch the app in DigitalOcean for the new deployment."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$previous" ]; then
              echo "::error::There is no :prod-previous image to roll back to."
              exit 1
            fi
            if [ "$previous" = "$prod" ]; then
              echo "Production already runs the previous image. Nothing to do."
              exit 0
            fi
            # Swap, so that a second rollback goes forward again
            retag prod "$IMAGE@$previous"
            if [ -n "$prod" ]; then
              retag prod-previous "$IMAGE@$prod"
            fi
            {
              echo "## Rolled production back"
              echo
              echo "| tag | before | after |"
              echo "|---|---|---|"
              echo "| prod | ${prod:-<none>} | $previous |"
              echo "| prod-previous | $previous | ${prod:-<none>} |"
              echo
              echo "Production autodeploys from :prod; watch the app in DigitalOcean for the new deployment."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
